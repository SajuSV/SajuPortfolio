<div class="acc-peek" aria-hidden="true"></div>
<span class="acc-peek-label" aria-hidden="true">{{ item().peekLabel }}</span>
<div class="acc-body">
  <div class="acc-media">
    <img class="work-cover-img" [src]="item().img" [alt]="item().title + ' cover'" loading="lazy" />
  </div>
  <span class="work-eyebrow">{{ item().eyebrow }}</span>
  <h3 class="work-title">{{ item().title }}</h3>
  <p class="work-desc">{{ item().desc }}</p>
  <div class="work-tags">
    @for (tag of item().tags; track tag) {<span>{{ tag }}</span>}
    <a [routerLink]="item().route" class="work-go" [attr.aria-label]="'View ' + item().title + ' projects'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg></a>
  </div>
</div>
