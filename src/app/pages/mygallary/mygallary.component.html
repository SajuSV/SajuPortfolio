<div class="loading" *ngIf="loading">Loading... {{ loadingPercent }}%</div>

<canvas #canvasRef></canvas>

<!-- Featured center card: full uncropped image, blurred backdrop fills the letterbox -->
<div
  #cardRef
  class="feature-card"
  [class.dragging]="dragging"
  [style.transform]="cardTransform"
  (mousedown)="onCardDown($event)"
  (touchstart)="onCardDown($event)"
>
  <img
    *ngFor="let slide of slides; let i = index"
    class="bg-blur"
    [class.active]="i === activeIndex"
    [src]="slide.bg"
    alt=""
  />
  <img
    *ngFor="let slide of slides; let i = index"
    class="fg-image"
    [class.active]="i === activeIndex"
    [src]="slide.fg"
    alt=""
  />
</div>

<div class="feature-nav">
  <button aria-label="Previous" (click)="goPrev()">&#8249;</button>
  <button aria-label="Next" (click)="goNext()">&#8250;</button>
</div>

<button class="fullscreen-btn" aria-label="Fullscreen" (click)="toggleFullscreen()">
  <svg *ngIf="!isFullscreen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
  </svg>
  <svg *ngIf="isFullscreen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
  </svg>
</button>
